<g class="float f6"><rect x="452" y="150" width="54" height="54" rx="13" fill="#1C1C55" stroke="#3CC47C" stroke-opacity=".45"/><path d="M479 161l14 8v16l-14 8-14-8v-16z" fill="none" stroke="#3CC47C" stroke-width="2.6" stroke-linejoin="round"/><text x="479" y="182" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700" font-size="11" fill="#3CC47C">JS</text></g>
<g class="float f3"><rect x="128" y="262" width="54" height="54" rx="13" fill="#1C1C55" stroke="#C9CAE8" stroke-opacity=".35"/><g fill="none" stroke="#E8EAFB" stroke-width="2.6" stroke-linecap="round"><circle cx="146" cy="278" r="4"/><circle cx="146" cy="302" r="4"/><circle cx="166" cy="286" r="4"/><path d="M146 282v16M166 290c0 8-20 4-20 8"/></g></g>

