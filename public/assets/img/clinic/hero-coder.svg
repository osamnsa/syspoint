<g class="float f2"><rect x="300" y="26" width="54" height="54" rx="13" fill="#1C1C55" stroke="#F7CB1E" stroke-opacity=".35"/><path d="M319 45l-8 8 8 8M335 45l8 8-8 8M330 42l-6 22" fill="none" stroke="#F7CB1E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
