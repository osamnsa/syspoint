  <g fill="#231915"><circle cx="330" cy="140" r="4"/><circle cx="348" cy="132" r="4"/><circle cx="368" cy="128" r="4"/><circle cx="388" cy="134" r="4"/><circle cx="402" cy="150" r="4"/><circle cx="318" cy="160" r="4"/><circle cx="340" cy="150" r="3.5"/><circle cx="360" cy="144" r="3.5"/><circle cx="380" cy="148" r="3.5"/><circle cx="398" cy="166" r="3.5"/></g>
