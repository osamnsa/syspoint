<g class="float f4"><rect x="500" y="34" width="56" height="56" rx="13" fill="#1C1C55" stroke="#61DAFB" stroke-opacity=".4"/><g fill="none" stroke="#61DAFB" stroke-width="2.4"><ellipse cx="528" cy="62" rx="18" ry="7"/><ellipse cx="528" cy="62" rx="18" ry="7" transform="rotate(60 528 62)"/><ellipse cx="528" cy="62" rx="18" ry="7" transform="rotate(-60 528 62)"/></g><circle cx="528" cy="62" r="3.5" fill="#61DAFB"/></g>
