  <path class="wire" d="M354 53 H414"/>
  <path class="wire" d="M468 84 H500"/>
  <path class="wire" d="M560 92 V140 H588"/>
  <path class="wire" d="M562 177 H506"/>
  <path class="wire" d="M155 236 V262"/>
</g>

