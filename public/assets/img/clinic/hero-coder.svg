  <rect x="80" y="104" width="1" height="116" fill="#F7CB1E" opacity=".15"/>
  <g class="ln l1"><rect x="90" y="108" width="40" height="5" rx="2.5" fill="#F7CB1E"/><rect x="134" y="108" width="54" height="5" rx="2.5" fill="#E8EAFB"/></g>
  <g class="ln l2"><rect x="102" y="122" width="30" height="5" rx="2.5" fill="#9A9BE0"/><rect x="136" y="122" width="70" height="5" rx="2.5" fill="#F7CB1E" opacity=".8"/></g>
  <g class="ln l3"><rect x="102" y="136" width="58" height="5" rx="2.5" fill="#E8EAFB"/><rect x="164" y="136" width="36" height="5" rx="2.5" fill="#61DAFB" opacity=".85"/></g>
  <g class="ln l4"><rect x="114" y="150" width="46" height="5" rx="2.5" fill="#F7CB1E"/><rect x="164" y="150" width="64" height="5" rx="2.5" fill="#9A9BE0"/></g>
  <g class="ln l5"><rect x="114" y="164" width="84" height="5" rx="2.5" fill="#E8EAFB"/></g>
  <g class="ln l6"><rect x="102" y="178" width="22" height="5" rx="2.5" fill="#9A9BE0"/><rect x="128" y="178" width="48" height="5" rx="2.5" fill="#3CC47C"/></g>
  <g class="ln l7"><rect x="90" y="192" width="70" height="5" rx="2.5" fill="#F7CB1E"/><rect x="164" y="192" width="30" height="5" rx="2.5" fill="#E8EAFB"/></g>
  <g class="ln l8"><rect x="90" y="206" width="20" height="5" rx="2.5" fill="#E8EAFB"/></g>
  <rect class="caret" x="114" y="204" width="3" height="10" fill="#F7CB1E"/>
</g>

