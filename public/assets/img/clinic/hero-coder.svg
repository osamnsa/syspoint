<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 8 640 452" role="img" aria-labelledby="t">
<title id="t">A developer coding at a laptop, with code and tech icons floating around</title>
<style>
  .float { transform-box: fill-box; animation: bob 6s ease-in-out infinite; }
  .f2 { animation-delay: -1.5s; } .f3 { animation-delay: -3s; } .f4 { animation-delay: -4.5s; } .f5 { animation-delay: -2.2s; } .f6 { animation-delay: -3.7s; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
  .ln { transform-box: fill-box; transform-origin: left center; animation: type 9s steps(14, end) infinite; }
  .l2 { animation-delay: .6s; } .l3 { animation-delay: 1.2s; } .l4 { animation-delay: 1.8s; } .l5 { animation-delay: 2.4s; } .l6 { animation-delay: 3s; } .l7 { animation-delay: 3.6s; } .l8 { animation-delay: 4.2s; }
  @keyframes type { 0% { transform: scaleX(0); } 8% { transform: scaleX(1); } 88% { transform: scaleX(1); } 92%, 100% { transform: scaleX(0); } }
  .caret { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .wire { stroke-dasharray: 2 7; animation: flow 1.6s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -18; } }
  .pulse { animation: pulse 3.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  .lamp { animation: lamp 5s ease-in-out infinite; }
  @keyframes lamp { 0%, 100% { opacity: .9; } 45% { opacity: .75; } 50% { opacity: .95; } }
  .steam path { stroke-dasharray: 40; animation: steam 3.4s ease-in-out infinite; }
  .steam path + path { animation-delay: -1.7s; }
  @keyframes steam { 0% { stroke-dashoffset: 40; opacity: 0; } 30% { opacity: .7; } 100% { stroke-dashoffset: -40; opacity: 0; } }
  .screenlight { animation: screen 4s ease-in-out infinite; }
  @keyframes screen { 0%, 100% { opacity: .5; } 50% { opacity: .75; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A2A72"/><stop offset="1" stop-color="#1B1B52"/></linearGradient>
  <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7A4A2E"/><stop offset="1" stop-color="#5A3320"/></linearGradient>
  <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B2B70"/><stop offset="1" stop-color="#1A1A4C"/></linearGradient>
  <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#20205E"/><stop offset="1" stop-color="#16164A"/></linearGradient>
  <radialGradient id="glowGold" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F7CB1E" stop-opacity=".55"/><stop offset="1" stop-color="#F7CB1E" stop-opacity="0"/></radialGradient>
  <radialGradient id="faceLight" cx=".5" cy="1" r=".8"><stop offset="0" stop-color="#F7CB1E" stop-opacity=".35"/><stop offset="1" stop-color="#F7CB1E" stop-opacity="0"/></radialGradient>
  <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7CB1E" stop-opacity=".45"/><stop offset="1" stop-color="#F7CB1E" stop-opacity="0"/></linearGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>

<!-- circuit wires -->
<g fill="none" stroke="#F7CB1E" stroke-width="2" stroke-linecap="round" opacity=".7">
